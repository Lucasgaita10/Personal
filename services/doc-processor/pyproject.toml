[project]
name = "stonegate-doc-processor"
version = "0.1.0"
description = "Stone Gate document ingestion + extraction service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.30",
  "redis>=5.0.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "mail-parser>=4.0.0",
  "pillow>=10.4.0",
  "pytesseract>=0.3.10",
  "tiktoken>=0.7.0",
  "anthropic>=0.40.0",
  "voyageai>=0.2.0",
  "numpy>=1.26.0",
]
